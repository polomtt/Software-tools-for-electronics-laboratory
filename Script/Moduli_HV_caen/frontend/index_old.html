<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAEN HV Control</title>
<style>
  :root{
    --bg: #14171a;
    --panel: #1c2126;
    --panel-2: #22282e;
    --line: #2c333a;
    --text: #e7ebee;
    --text-dim: #8b96a1;
    --amber: #ffb020;
    --amber-dim: #6b5220;
    --red: #ff4d4f;
    --red-dim: #4a1f20;
    --green: #34d17c;
    --green-dim: #1c4a30;
    --teal: #33d6b0;
    --blue: #38bdf8;
    --blue-dim: #123044;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(1200px 600px at 15% -10%, #1a2c2c 0%, transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--sans); padding:32px 20px 60px;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:10px;}
  header h1{font-family:var(--mono); font-size:20px; letter-spacing:0.5px; margin:0; font-weight:600;}
  header h1 span{color:var(--amber);}
  header .sub{color:var(--text-dim); font-size:12.5px; font-family:var(--mono); display:flex; gap:14px; align-items:center;}
  header button{
    font-family:var(--sans); font-weight:600; font-size:12px; border-radius:6px;
    padding:6px 12px; border:1px solid var(--line); background:transparent; color:var(--text);
    cursor:pointer;
  }
  header button:hover{border-color:var(--text-dim);}

  .module{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px; margin-bottom:20px;
  }
  .module-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .module-head .id{display:flex; align-items:baseline; gap:10px;}
  .module-head .mname{font-family:var(--mono); font-weight:700; font-size:16px;}
  .module-head .mmodel{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); border:1px solid var(--line); padding:2px 7px; border-radius:4px;}
  .module-head .actions{display:flex; gap:8px; align-items:center;}

  button.primary{background:var(--amber); color:#1a1400; border:1px solid transparent; font-weight:600; border-radius:6px; padding:8px 14px; font-size:12.5px; cursor:pointer;}
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px 14px; font-size:12.5px; cursor:pointer;}
  button.ghost:hover{border-color:var(--text-dim);}
  button:disabled{opacity:0.35; cursor:not-allowed;}

  .status-line{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; margin-bottom:16px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--text-dim);}
  .dot.live{background:var(--teal); box-shadow:0 0 8px var(--teal);}
  .dot.err{background:var(--red); box-shadow:0 0 8px var(--red);}

  .channels{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:680px){ .channels{grid-template-columns:1fr;} }

  .chan{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:16px;
  }
  .chan-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .chan-head .name{font-family:var(--mono); font-weight:600; font-size:13px;}
  .chan-head .name .polarity{
    display:inline-block; margin-left:6px; font-size:10.5px; font-weight:700;
    color:var(--text-dim); border:1px solid var(--line); border-radius:4px;
    padding:1px 5px; vertical-align:middle;
  }
  .chan-head .name .polarity.pos{ color:var(--amber); border-color:#8a6a2a; }
  .chan-head .name .polarity.neg{ color:var(--teal); border-color:#1f6b5c; }
  .chan-head .submodule{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-bottom:12px;}

  /* --- LED --- */
  .led-wrap{display:flex; align-items:center; gap:6px;}
  .led{
    width:11px; height:11px; border-radius:50%; background:#2a2a2a;
    box-shadow: inset 0 0 2px rgba(0,0,0,0.6);
    transition: background .2s, box-shadow .2s;
  }
  .led.on{ background: var(--red); box-shadow:0 0 9px 2px var(--red); }
  .led.blink-amber{ background: var(--amber); box-shadow:0 0 9px 2px var(--amber); animation: blink-slow 1s infinite; }
  .led.blink-fast{ background: var(--red); box-shadow:0 0 9px 2px var(--red); animation: blink-fast .35s infinite; }
  @keyframes blink-slow{ 0%,100%{opacity:1;} 50%{opacity:0.15;} }
  @keyframes blink-fast{ 0%,100%{opacity:1;} 50%{opacity:0.1;} }

  /* --- Status pill (piu' leggibile) --- */
  .status-pill{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.3px;
    padding:4px 10px; border-radius:20px; border:1px solid transparent; text-transform:uppercase;
  }
  .status-pill.st-off{ background:#2a2f34; color:var(--text-dim); border-color:var(--line); }
  .status-pill.st-on{ background:var(--green-dim); color:var(--green); border-color:#2a6b46; }
  .status-pill.st-ramp{ background:var(--amber-dim); color:var(--amber); border-color:#8a6a2a; animation: pulse-bg 1.2s infinite; }
  .status-pill.st-error{ background:var(--red-dim); color:var(--red); border-color:#7a2f31; }
  @keyframes pulse-bg{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }

  .readout-row{display:flex; gap:10px; margin:12px 0;}
  .readout{flex:1; background:var(--panel); border-radius:8px; padding:10px 12px; border:1px solid var(--line);}
  .readout .label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;}
  .readout .val{font-family:var(--mono); font-size:20px; margin-top:2px;}
  .readout .val .unit{font-size:12px; color:var(--text-dim); margin-left:2px;}

  .bar-track{height:5px; background:var(--panel); border-radius:3px; overflow:hidden; margin:2px 0 14px; border:1px solid var(--line);}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--amber-dim), var(--amber)); width:0%; transition:width .25s;}

  /* --- Griglia unica per Vset / Iset / Ramp Up / Ramp Down: 2x2, celle
     garantite della stessa larghezza perche' e' una vera CSS grid, non
     due row flex separate. --- */
  .settings-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin:12px 0;
  }
  .setting-field{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .setting-box{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; min-width:0;
  }
  .setting-box .label{
    font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;
  }
  .setting-box .val-edit{
    display:flex; align-items:baseline; gap:10px; margin-top:4px;
  }
  .setting-box .val-edit input[type=number]{
    flex:1; min-width:0; background:transparent; border:none; padding:0 6px 0 0;
    font-family:var(--mono); font-size:20px; color:var(--text);
  }
  .setting-box .val-edit input[type=number]:focus{ outline:none; }
  .setting-box .val-edit .unit{
    flex:none; white-space:nowrap; font-size:12px; color:var(--text-dim);
  }
  .setting-field .btn-blue{ width:100%; }

  /* --- Bottone azzurro (azione "Imposta"/"Applica") --- */
  button.btn-blue{
    background:var(--blue); color:#062033; border:1px solid transparent;
    font-weight:600; border-radius:6px; padding:8px 12px; font-size:12.5px;
    cursor:pointer; white-space:nowrap; min-height:38px;
  }
  button.btn-blue:hover{ filter:brightness(1.1); }

  /* --- Tabs --- */
  .tabs{display:flex; gap:4px; margin-bottom:12px; border-bottom:1px solid var(--line);}
  .tab-btn{
    font-family:var(--sans); font-size:11.5px; font-weight:600; color:var(--text-dim);
    background:transparent; border:none; border-bottom:2px solid transparent;
    padding:6px 4px; cursor:pointer; margin-right:14px;
  }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--amber); }
  .tab-btn:hover{ color:var(--text); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* --- ON / OFF power buttons --- */
  .power-row{display:flex; gap:8px; margin-top:2px;}
  .btn-power{
    flex:1; font-family:var(--sans); font-weight:700; font-size:12.5px; letter-spacing:0.3px;
    border-radius:6px; padding:9px 10px; cursor:pointer; text-transform:uppercase;
    border:1.5px solid transparent; transition:filter .15s, opacity .15s;
  }
  .btn-on{ background:var(--green-dim); color:var(--green); border-color:#2a6b46; }
  .btn-on:hover{ filter:brightness(1.15); }
  .btn-on.active{ background:var(--green); color:#062012; border-color:var(--green); }

  .btn-off{ background:var(--red-dim); color:var(--red); border-color:#7a2f31; }
  .btn-off:hover{ filter:brightness(1.15); }
  .btn-off.active{ background:var(--red); color:#2a0505; border-color:var(--red); }

  .last-error{
    font-family:var(--mono); font-size:10.5px; color:var(--red);
    margin-top:10px; line-height:1.4; word-break:break-word;
  }

  .empty{color:var(--text-dim); font-family:var(--mono); font-size:13px; padding:30px; text-align:center; border:1px dashed var(--line); border-radius:10px;}

  footer{margin-top:24px; color:var(--text-dim); font-size:11.5px; font-family:var(--mono); line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>CAEN <span>HV Control</span></h1>
    <div class="sub">
      <span id="clock"></span>
      <button id="btnReload">Ricarica config.json</button>
    </div>
  </header>

  <div id="modules"><div class="empty">Caricamento moduli…</div></div>

  <footer>
    Moduli, canali, VSet e rampe di default sono definiti in
    <code>backend/config.json</code>. Il LED replica la semantica dei LED
    fisici: fisso rosso = canale acceso e stabile, lampeggiante ambra =
    rampa in corso, lampeggiante rosso veloce = sovracorrente.
  </footer>

</div>

<script>
const API = "/api";
let ws = null;
let modulesMeta = [];
// canali gia' inizializzati con i valori di rampa letti dall'hardware,
// per non sovrascrivere quello che l'utente sta digitando
const rampInitialized = new Set();
// canale per cui abbiamo gia' popolato il campo Vset col valore letto
// dall'hardware (una volta sola, per non sovrascrivere l'utente mentre digita)
const vsetInitialized = new Set();
// idem per il campo Iset
const isetInitialized = new Set();
// canali per cui abbiamo gia' mostrato il badge di polarita' (statica, va mostrata una volta sola)
const polarityShown = new Set();

async function fetchJSON(url, opts){
  const res = await fetch(url, opts);
  const data = await res.json().catch(()=>({}));
  if (!res.ok){
    throw new Error(data.detail || res.statusText);
  }
  return data;
}

async function postJSON(url, body){
  try{
    return await fetchJSON(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body || {})
    });
  }catch(e){
    alert("Errore: " + e.message);
    throw e;
  }
}

function moduleTemplate(mod){
  const chanHTML = Array.from({length: mod.n_channels}, (_, ch) => channelTemplate(mod.name, ch)).join("");
  return `
  <div class="module" data-module="${mod.name}">
    <div class="module-head">
      <div class="id">
        <span class="mname">${mod.name}</span>
        <span class="mmodel">${mod.model}</span>
      </div>
      <div class="actions">
        <button class="primary" data-action="connect" data-module="${mod.name}">Connetti</button>
        <button class="ghost" data-action="disconnect" data-module="${mod.name}" disabled>Disconnetti</button>
        <button class="ghost" data-action="apply" data-module="${mod.name}" disabled>Applica config</button>
      </div>
    </div>
    <div class="status-line">
      <div class="dot" id="dot-${mod.name}"></div>
      <span id="conntext-${mod.name}">Non connesso</span>
    </div>
    <div class="channels">${chanHTML}</div>
  </div>`;
}

function channelTemplate(moduleName, ch){
  const id = `${moduleName}-${ch}`;
  return `
  <div class="chan" data-module="${moduleName}" data-ch="${ch}">
    <div class="chan-head">
      <span class="name">CH ${ch}<span class="polarity" id="pol-${id}" style="display:none;"></span></span>
      <div class="led-wrap">
        <span class="status-pill st-off" id="status-${id}">OFF</span>
        <div class="led" id="led-${id}"></div>
      </div>
    </div>
    <div class="submodule">${moduleName} · canale ${ch}</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="monitor" data-id="${id}">Monitor</button>
      <button class="tab-btn" data-tab="ramp" data-id="${id}">Settaggio</button>
    </div>

    <div class="tab-panel active" id="tab-monitor-${id}">
      <div class="readout-row">
        <div class="readout">
          <div class="label">Vmon</div>
          <div class="val"><span id="vmon-${id}">0.00</span><span class="unit">V</span></div>
        </div>
        <div class="readout">
          <div class="label">Imon</div>
          <div class="val"><span id="imon-${id}">0.000</span><span class="unit">µA</span></div>
        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="bar-${id}"></div></div>

      <div class="power-row">
        <button class="btn-power btn-on" data-action="on" data-module="${moduleName}" data-ch="${ch}">ON</button>
        <button class="btn-power btn-off" data-action="off" data-module="${moduleName}" data-ch="${ch}">OFF</button>
      </div>
    </div>

    <div class="tab-panel" id="tab-ramp-${id}">
      <div class="settings-grid">
        <div class="setting-field">
          <div class="setting-box">
            <div class="label">Vset</div>
            <div class="val-edit">
              <input type="number" id="vset-${id}" value="0" min="0" step="1">
              <span class="unit">V</span>
            </div>
          </div>
          <button class="btn-blue" data-action="setv" data-module="${moduleName}" data-ch="${ch}">Imposta</button>
        </div>

        <div class="setting-field">
          <div class="setting-box">
            <div class="label">Iset</div>
            <div class="val-edit">
              <input type="number" id="iset-${id}" value="0" min="0" step="1">
              <span class="unit">µA</span>
            </div>
          </div>
          <button class="btn-blue" data-action="seti" data-module="${moduleName}" data-ch="${ch}">Imposta</button>
        </div>

        <div class="setting-field">
          <div class="setting-box">
            <div class="label">Ramp Up</div>
            <div class="val-edit">
              <input type="number" id="rampup-${id}" value="50" min="1" step="1">
              <span class="unit">V/s</span>
            </div>
          </div>
        </div>

        <div class="setting-field">
          <div class="setting-box">
            <div class="label">Ramp Down</div>
            <div class="val-edit">
              <input type="number" id="rampdown-${id}" value="50" min="1" step="1">
              <span class="unit">V/s</span>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-blue" data-action="setramp" data-module="${moduleName}" data-ch="${ch}" style="width:100%;">Applica rampa</button>
    </div>

    <div class="last-error" id="err-${id}" style="display:none;"></div>
  </div>`;
}

async function loadModules(){
  const modulesDiv = document.getElementById("modules");
  try{
    modulesMeta = await fetchJSON(`${API}/modules`);
  }catch(e){
    modulesDiv.innerHTML = `<div class="empty">Impossibile caricare i moduli: ${e.message}</div>`;
    return;
  }

  if (!modulesMeta.length){
    modulesDiv.innerHTML = `<div class="empty">Nessun modulo definito in config.json</div>`;
    return;
  }

  modulesDiv.innerHTML = modulesMeta.map(moduleTemplate).join("");
  bindEvents();
  startMonitor();
}

function bindEvents(){
  document.querySelectorAll('[data-action="connect"]').forEach(btn => {
    btn.onclick = async () => {
      const name = btn.dataset.module;
      try{
        await postJSON(`${API}/modules/${name}/connect`, {apply_config: true});
        clearInitFor(name);
        setConnectedUI(name, true);
      }catch(e){}
    };
  });

  document.querySelectorAll('[data-action="disconnect"]').forEach(btn => {
    btn.onclick = async () => {
      const name = btn.dataset.module;
      await fetch(`${API}/modules/${name}/disconnect`, {method:"POST"});
      setConnectedUI(name, false);
    };
  });

  document.querySelectorAll('[data-action="apply"]').forEach(btn => {
    btn.onclick = async () => {
      await postJSON(`${API}/modules/${btn.dataset.module}/apply-config`, {});
    };
  });

  document.querySelectorAll('[data-action="setv"]').forEach(btn => {
    btn.onclick = async () => {
      const {module, ch} = btn.dataset;
      const v = parseFloat(document.getElementById(`vset-${module}-${ch}`).value);
      await postJSON(`${API}/modules/${module}/channels/${ch}/vset`, {voltage: v});
    };
  });

  document.querySelectorAll('[data-action="seti"]').forEach(btn => {
    btn.onclick = async () => {
      const {module, ch} = btn.dataset;
      const i = parseFloat(document.getElementById(`iset-${module}-${ch}`).value);
      await postJSON(`${API}/modules/${module}/channels/${ch}/iset`, {current: i});
    };
  });

  document.querySelectorAll('[data-action="setramp"]').forEach(btn => {
    btn.onclick = async () => {
      const {module, ch} = btn.dataset;
      const up = parseFloat(document.getElementById(`rampup-${module}-${ch}`).value);
      const down = parseFloat(document.getElementById(`rampdown-${module}-${ch}`).value);
      await postJSON(`${API}/modules/${module}/channels/${ch}/ramp`, {ramp_up: up, ramp_down: down});
    };
  });

  document.querySelectorAll('[data-action="on"]').forEach(btn => {
    btn.onclick = async () => {
      const {module, ch} = btn.dataset;
      await postJSON(`${API}/modules/${module}/channels/${ch}/power`, {on: true});
    };
  });

  document.querySelectorAll('[data-action="off"]').forEach(btn => {
    btn.onclick = async () => {
      const {module, ch} = btn.dataset;
      await postJSON(`${API}/modules/${module}/channels/${ch}/power`, {on: false});
    };
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const tab = btn.dataset.tab;
      const chanEl = btn.closest('.chan');
      chanEl.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      chanEl.querySelectorAll('.tab-panel').forEach(p => {
        p.classList.toggle('active', p.id === `tab-${tab}-${id}`);
      });
    };
  });
}

function clearInitFor(name){
  const mod = modulesMeta.find(m => m.name === name);
  const n = mod ? mod.n_channels : 0;
  for (let ch = 0; ch < n; ch++){
    const id = `${name}-${ch}`;
    rampInitialized.delete(id);
    vsetInitialized.delete(id);
    isetInitialized.delete(id);
    polarityShown.delete(id);
  }
}

function setConnectedUI(name, connected){
  const mod = document.querySelector(`.module[data-module="${name}"]`);
  if (!mod) return;
  mod.querySelector('[data-action="connect"]').disabled = connected;
  mod.querySelector('[data-action="disconnect"]').disabled = !connected;
  mod.querySelector('[data-action="apply"]').disabled = !connected;
  document.getElementById(`dot-${name}`).className = "dot" + (connected ? " live" : "");
  document.getElementById(`conntext-${name}`).textContent = connected ? "Connesso" : "Non connesso";
}

function statusPillClass(status){
  if (status === "ON") return "st-on";
  if (status === "OVERCURRENT") return "st-error";
  if (status === "RAMPING UP" || status === "RAMPING DOWN") return "st-ramp";
  return "st-off";
}

function ledClass(status, powerOn){
  if (status === "OVERCURRENT") return "led blink-fast";
  if (status === "RAMPING UP" || status === "RAMPING DOWN") return "led blink-amber";
  if (status === "ON" || powerOn) return "led on";
  return "led";
}

function startMonitor(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/monitor`);

  ws.onmessage = (evt) => {
    const data = JSON.parse(evt.data);
    if (!data.ok) return;

    for (const [name, mstat] of Object.entries(data.modules || {})){
      setConnectedUI(name, mstat.connected);
      if (!mstat.connected) continue;

      for (const [ch, s] of Object.entries(mstat.channels || {})){
        const id = `${name}-${ch}`;
        const vmonEl = document.getElementById(`vmon-${id}`);
        if (!vmonEl) continue;

        vmonEl.textContent = s.vmon.toFixed(2);
        document.getElementById(`imon-${id}`).textContent = s.imon.toFixed(3);

        const pillEl = document.getElementById(`status-${id}`);
        pillEl.textContent = s.status;
        pillEl.className = "status-pill " + statusPillClass(s.status);

        const pct = Math.min(100, (s.vmon / 4000) * 100);
        document.getElementById(`bar-${id}`).style.width = pct + "%";

        document.getElementById(`led-${id}`).className = ledClass(s.status, s.power_on);

        // Evidenzia il pulsante ON/OFF corrispondente allo stato attuale
        const chanEl = document.querySelector(`.chan[data-module="${name}"][data-ch="${ch}"]`);
        if (chanEl){
          const onBtn = chanEl.querySelector('[data-action="on"]');
          const offBtn = chanEl.querySelector('[data-action="off"]');
          if (onBtn && offBtn){
            onBtn.classList.toggle('active', s.power_on);
            offBtn.classList.toggle('active', !s.power_on);
          }
        }

        // Precompila i campi rampa una sola volta (per non sovrascrivere
        // quello che l'utente sta digitando)
        if (!rampInitialized.has(id)){
          const upEl = document.getElementById(`rampup-${id}`);
          const downEl = document.getElementById(`rampdown-${id}`);
          if (upEl && downEl){
            upEl.value = s.ramp_up;
            downEl.value = s.ramp_down;
            rampInitialized.add(id);
          }
        }

        // Idem per Vset: lo precompiliamo col valore letto dall'hardware
        // la prima volta, poi lasciamo il campo libero (l'utente lo
        // modifica e clicca "Imposta" quando vuole).
        if (!vsetInitialized.has(id)){
          const vsetEl = document.getElementById(`vset-${id}`);
          if (vsetEl){
            vsetEl.value = s.vset;
            vsetInitialized.add(id);
          }
        }

        // Idem per Iset (se la board lo espone/legge)
        if (!isetInitialized.has(id)){
          const isetEl = document.getElementById(`iset-${id}`);
          if (isetEl && s.iset !== undefined && s.iset !== null){
            isetEl.value = s.iset;
            isetInitialized.add(id);
          }
        }

        // Polarita': statica, la mostriamo una sola volta se la board la espone
        if (!polarityShown.has(id) && s.polarity){
          const polEl = document.getElementById(`pol-${id}`);
          if (polEl){
            polEl.textContent = s.polarity === "+" ? "+HV" : (s.polarity === "-" ? "−HV" : s.polarity);
            polEl.className = "polarity" + (s.polarity === "+" ? " pos" : (s.polarity === "-" ? " neg" : ""));
            polEl.style.display = "inline-block";
            polarityShown.add(id);
          }
        }

        const errEl = document.getElementById(`err-${id}`);
        if (s.last_error){
          errEl.textContent = "⚠ " + s.last_error;
          errEl.style.display = "block";
        } else {
          errEl.style.display = "none";
        }
      }
    }
  };

  ws.onerror = () => {};
}

document.getElementById("btnReload").onclick = async () => {
  try{
    await postJSON(`${API}/config/reload`, {});
    rampInitialized.clear();
    vsetInitialized.clear();
    isetInitialized.clear();
    polarityShown.clear();
    await loadModules();
  }catch(e){}
};

function tickClock(){
  document.getElementById("clock").textContent = new Date().toLocaleString("it-IT");
}
setInterval(tickClock, 1000); tickClock();

loadModules();
</script>
</body>
</html>
